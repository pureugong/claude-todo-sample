<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #8a9099;
    --border: #e1e4e8;
    --accent: #3b6ef5;
    --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #20232a;
      --text: #e6e8eb;
      --muted: #868c96;
      --border: #33373f;
      --accent: #6c93ff;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 1rem;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.add {
    padding: 10px 16px;
    font-size: 1rem;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  li label { flex: 1; word-break: break-word; cursor: pointer; }
  li.done label { text-decoration: line-through; color: var(--muted); }
  li button.delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
  }
  li button.delete:hover { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 24px 0 8px; }
  .footer { margin-top: 12px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록</h1>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
    <button type="submit" class="add">추가</button>
  </form>
  <ul id="list"></ul>
  <p class="empty" id="empty">할 일이 없습니다.</p>
  <div class="footer" id="footer"></div>
</div>
<script>
  const STORAGE_KEY = 'todos';
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const footer = document.getElementById('footer');

  let todos = load();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 저장소를 쓸 수 없는 환경에서도 앱은 계속 동작한다.
    }
  }

  function render() {
    list.innerHTML = '';
    for (const todo of todos) {
      const li = document.createElement('li');
      li.dataset.id = todo.id;
      if (todo.done) li.className = 'done';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'todo-' + todo.id;
      checkbox.checked = todo.done;

      const label = document.createElement('label');
      label.htmlFor = checkbox.id;
      label.textContent = todo.text;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete';
      del.title = '삭제';
      del.setAttribute('aria-label', '삭제');
      del.textContent = '✕';

      li.append(checkbox, label, del);
      list.appendChild(li);
    }
    const remaining = todos.filter(t => !t.done).length;
    empty.hidden = todos.length > 0;
    footer.textContent = todos.length ? `남은 할 일 ${remaining}개 / 전체 ${todos.length}개` : '';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  });

  list.addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const id = e.target.closest('li').dataset.id;
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = e.target.checked;
    save();
    render();
  });

  list.addEventListener('click', e => {
    if (!e.target.classList.contains('delete')) return;
    const id = e.target.closest('li').dataset.id;
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  });

  render();
</script>
</body>
</html>
